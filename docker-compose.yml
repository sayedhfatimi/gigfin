# GigFin self-hosted stack.
#
# Air-gap notes:
#   - DISABLE_BEACON=true turns off Convex's anonymous telemetry (on by default).
#   - The convex backend defaults to SQLite in the `gigfin-convex-data` volume (which
#     also holds file storage). Set POSTGRES_URL on `convex` only if you want an external DB.
#   - No service requires internet egress at runtime.
#
# The `gigfin` app service runs the prebuilt GHCR image and, on start, deploys the
# Convex functions to the `convex` backend via `bunx convex deploy`. To build from
# source instead, layer docker-compose.build.yml (see README). The only vars you set
# are in .env (run `scripts/setup.sh` first); the internal convex:* URLs are fixed.

services:
  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=${CONVEX_INSTANCE_NAME:-gigfin}
      # Pinned so the admin key is stable across deploys (generated by scripts/setup.sh).
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET}
      - DISABLE_BEACON=true
      - DISABLE_METRICS_ENDPOINT=true
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-true}
      # Cloud origin = where the BROWSER reaches the backend (3210). Storage/receipt
      # URLs are built from this, so it must be the public/LAN URL, not loopback.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_PUBLIC_URL:-http://127.0.0.1:3210}
      # Site origin (3211) stays internal: it is the issuer/JWKS source the backend
      # validates browser tokens against, and is only ever reached in-network (here,
      # by the backend itself — hence loopback).
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - POSTGRES_URL
      - DO_NOT_REQUIRE_SSL
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s
    restart: unless-stopped

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_PUBLIC_URL:-http://127.0.0.1:3210}
    depends_on:
      convex:
        condition: service_healthy
    restart: unless-stopped

  gigfin:
    image: ghcr.io/sayedhfatimi/gigfin:latest
    ports:
      - "${GIGFIN_PORT:-3000}:3000"
    environment:
      # Server-internal: the app reaches the backend over the compose network.
      # Fixed literals (service name `convex`) — never override these; a stray
      # CONVEX_URL=127.0.0.1 in your env is exactly what breaks sign-up.
      - CONVEX_SELF_HOSTED_URL=http://convex:3210
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY}
      - CONVEX_URL=http://convex:3210
      - CONVEX_SITE_URL=http://convex:3211
      # Browser-reachable backend URL (set per deployment in .env).
      - CONVEX_PUBLIC_URL=${CONVEX_PUBLIC_URL:-http://127.0.0.1:3210}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Optional integrations (omit to disable — air-gap friendly).
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GIGFIN_DISABLE_SIGNUP=${GIGFIN_DISABLE_SIGNUP:-}
      - ANALYTICS_SCRIPT_URL=${ANALYTICS_SCRIPT_URL:-}
      - ANALYTICS_SITE_ID=${ANALYTICS_SITE_ID:-}
    depends_on:
      convex:
        condition: service_healthy
    restart: unless-stopped

volumes:
  convex-data:
    name: gigfin-convex-data
